name: Build Windows Portable

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  verify:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run smoke
      - run: npm run render-check
      - run: npm run dom-check
      - run: npm run dom-check:chrome
      - run: npm run build

  portable:
    name: Portable Windows x64
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: TechnoBrowse-Portable-x64
          path: release/*.exe
          retention-days: 30
