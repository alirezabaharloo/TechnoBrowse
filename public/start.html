<!doctype html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark light" />
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; font-src 'self'; form-action https://www.google.com; base-uri 'none'" />
<title>زبانهٔ جدید</title>
<script>
  // Apply the persisted theme before first paint (shared key with the app).
  try {
    var t = window.localStorage.getItem('tb-theme');
    document.documentElement.dataset.theme = (t === 'light' || t === 'dark') ? t : 'dark';
  } catch (e) {
    document.documentElement.dataset.theme = 'dark';
  }
</script>
<style>
  /* Sahel — OFL Persian font (see fonts/OFL-Sahel.txt) */
  @font-face {
    font-family: 'Sahel';
    font-style: normal;
    font-weight: 400;
    font-display: swap;
    src: url('./fonts/Sahel.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Sahel';
    font-style: normal;
    font-weight: 500 600;
    font-display: swap;
    src: url('./fonts/Sahel-SemiBold.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Sahel';
    font-style: normal;
    font-weight: 700;
    font-display: swap;
    src: url('./fonts/Sahel-Bold.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Sahel';
    font-style: normal;
    font-weight: 800 900;
    font-display: swap;
    src: url('./fonts/Sahel-Black.woff2') format('woff2');
  }
  :root,
  [data-theme='dark'] {
    color-scheme: dark;
    --bg: #05070d;
    --panel: #101a30;
    --panel-strong: #141d33;
    --panel-border: rgba(148, 184, 255, 0.14);
    --text: #e8edf7;
    --text-strong: #f2f6ff;
    --muted: #8b98b8;
    --hint: #5d6a8c;
    --shell-shadow: 0 6px 22px rgba(0, 0, 0, 0.45);
    --shell-shadow-focus: 0 0 0 4px rgba(61, 139, 255, 0.15), 0 14px 46px rgba(0, 0, 0, 0.5);
    --tile-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    --tile-shadow-hover: 0 12px 34px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(61, 139, 255, 0.2);
    --glow-top: rgba(59, 130, 246, 0.22);
    --glow-side-a: rgba(61, 139, 255, 0.14);
    --glow-side-b: rgba(37, 99, 235, 0.12);
    --clock-shadow: 0 0 34px rgba(61, 139, 255, 0.35);
    --logo-shadow: 0 4px 16px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(61, 139, 255, 0.25);
  }
  [data-theme='light'] {
    color-scheme: light;
    --bg: #eceff7;
    --panel: #ffffff;
    --panel-strong: #f5f6fc;
    --panel-border: rgba(15, 23, 42, 0.12);
    --text: #1e293b;
    --text-strong: #0f172a;
    --muted: #64748b;
    --hint: #94a3b8;
    --shell-shadow: 0 6px 18px rgba(15, 23, 42, 0.08);
    --shell-shadow-focus: 0 0 0 4px rgba(37, 99, 235, 0.14), 0 18px 50px rgba(15, 23, 42, 0.14);
    --tile-shadow: 0 4px 14px rgba(15, 23, 42, 0.06);
    --tile-shadow-hover: 0 14px 34px rgba(15, 23, 42, 0.14);
    --glow-top: rgba(59, 130, 246, 0.16);
    --glow-side-a: rgba(61, 139, 255, 0.12);
    --glow-side-b: rgba(37, 99, 235, 0.1);
    --clock-shadow: 0 0 26px rgba(37, 99, 235, 0.16);
    --logo-shadow: 0 4px 14px rgba(15, 23, 42, 0.18), 0 0 0 1px rgba(37, 99, 235, 0.12);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background:
      radial-gradient(900px 520px at 50% -10%, var(--glow-top), transparent 60%),
      radial-gradient(700px 500px at 85% 110%, var(--glow-side-a), transparent 60%),
      radial-gradient(600px 420px at 8% 105%, var(--glow-side-b), transparent 55%),
      var(--bg);
    color: var(--text);
    font-family: 'Sahel', 'Segoe UI', Tahoma, system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 48px 24px;
    min-height: 100vh;
    user-select: none;
    transition: background .25s ease, color .25s ease;
  }

  .theme-toggle {
    position: fixed;
    top: 16px;
    inset-inline-end: 16px;
    z-index: 10;
    width: 40px; height: 40px;
    border-radius: 12px;
    border: 1px solid var(--panel-border);
    background: var(--panel);
    color: var(--muted);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: var(--tile-shadow);
    transition: color .18s ease, border-color .18s ease, transform .15s ease;
  }
  .theme-toggle:hover { color: var(--text-strong); border-color: rgba(61, 139, 255, 0.45); transform: translateY(-1px); }
  /* dark theme: show the sun (switch to light); light theme: show the moon (switch to dark) */
  .theme-toggle .icon-sun { display: block; }
  .theme-toggle .icon-moon { display: none; }
  [data-theme='light'] .theme-toggle .icon-sun { display: none; }
  [data-theme='light'] .theme-toggle .icon-moon { display: block; }

  .clock { font-size: 60px; font-weight: 800; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; line-height: 1.15; color: var(--text-strong); text-shadow: var(--clock-shadow); }
  .date { margin-top: 10px; color: var(--muted); font-size: 14px; font-weight: 500; }
  .brand { margin-top: 28px; display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 0.06em; }
  .brand img { width: 34px; height: 34px; border-radius: 9px; box-shadow: var(--logo-shadow); }

  form.search { margin-top: 24px; width: min(620px, 92vw); }
  .search-shell {
    display: flex; align-items: center; gap: 12px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 16px;
    padding: 4px 8px 4px 8px; padding-inline-start: 18px;
    box-shadow: var(--shell-shadow);
    transition: border-color .18s ease, box-shadow .18s ease;
  }
  .search-shell:focus-within {
    border-color: rgba(61, 139, 255, 0.5);
    box-shadow: var(--shell-shadow-focus);
  }
  .search-shell svg { color: var(--muted); flex: 0 0 auto; }
  .search-shell input {
    flex: 1; background: transparent; border: 0; outline: none;
    color: var(--text); font-size: 16px; height: 46px; font-family: inherit;
    min-width: 0;
  }
  .search-shell input::placeholder { color: var(--hint); }
  .go {
    border: 0; cursor: pointer; border-radius: 12px; height: 40px; padding: 0 20px;
    color: #fff; font-weight: 700; font-size: 14px; font-family: inherit;
    background: linear-gradient(135deg, #1d4ed8, #2563eb);
    box-shadow: 0 6px 16px rgba(37, 99, 235, 0.4);
    transition: transform .15s ease, filter .15s ease;
    flex: 0 0 auto;
  }
  .go:hover { transform: translateY(-1px); filter: brightness(1.12); }
  .go:active { transform: translateY(0); }

  .tiles { margin-top: 32px; display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; max-width: 720px; }
  .tile {
    width: 118px; height: 108px; border-radius: 16px; text-decoration: none;
    background: var(--panel); border: 1px solid var(--panel-border);
    box-shadow: var(--tile-shadow);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    transition: transform .16s ease, border-color .16s ease, box-shadow .16s ease;
  }
  .tile:hover {
    transform: translateY(-3px);
    border-color: rgba(61, 139, 255, 0.45);
    box-shadow: var(--tile-shadow-hover);
  }
  .tile .glyph {
    width: 40px; height: 40px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 17px; color: #0b1220;
  }
  .tile .label { color: var(--text); font-size: 12.5px; font-weight: 600; }
  .hint { margin-top: 30px; color: var(--hint); font-size: 12px; font-weight: 500; }
</style>
</head>
<body>
  <button class="theme-toggle" id="themeToggle" type="button" aria-label="تغییر حالت تیره و روشن" title="تغییر حالت تیره و روشن">
    <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
    <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
  </button>

  <div class="clock" id="clock">--:--</div>
  <div class="date" id="date">در حال بارگذاری…</div>
  <div class="brand"><img src="./technowin.png" alt="TechnoBrowse" /> TechnoBrowse</div>

  <form class="search" action="https://www.google.com/search" method="GET">
    <div class="search-shell">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="q" name="q" type="text" placeholder="جستجو در گوگل یا نشانی در نوار آدرس…" autocomplete="off" spellcheck="false" autofocus />
      <button class="go" type="submit">جستجو</button>
    </div>
  </form>

  <div class="tiles" id="tiles"></div>
  <div class="hint">هر پروفایل کوکی‌ها، نشست‌ها و حافظهٔ خودش را نگه می‌دارد — بدون ترکیب حساب‌ها جابه‌جا شوید.</div>

<script>
  var TILES = [
    { label: 'گوگل',     url: 'https://www.google.com',    glyph: 'G',  bg: 'linear-gradient(135deg,#fde68a,#fbbf24)' },
    { label: 'جیمیل',    url: 'https://mail.google.com',   glyph: 'ای', bg: 'linear-gradient(135deg,#fda4af,#fb7185)' },
    { label: 'چت‌جی‌پی‌تی', url: 'https://chatgpt.com',    glyph: 'چ',  bg: 'linear-gradient(135deg,#a7f3d0,#34d399)' },
    { label: 'جمینای',   url: 'https://gemini.google.com', glyph: 'ج',  bg: 'linear-gradient(135deg,#c4b5fd,#8b5cf6)' },
    { label: 'کلود',     url: 'https://claude.ai',         glyph: 'ک',  bg: 'linear-gradient(135deg,#fed7aa,#fb923c)' },
    { label: 'یوتیوب',   url: 'https://www.youtube.com',   glyph: 'ی',  bg: 'linear-gradient(135deg,#fecaca,#ef4444)' },
    { label: 'گیت‌هاب',  url: 'https://github.com',        glyph: 'گ',  bg: 'linear-gradient(135deg,#cbd5e1,#64748b)' },
    { label: 'ویکی‌پدیا', url: 'https://www.wikipedia.org', glyph: 'و', bg: 'linear-gradient(135deg,#e2e8f0,#94a3b8)' }
  ];
  var tiles = document.getElementById('tiles');
  TILES.forEach(function (t) {
    var a = document.createElement('a');
    a.className = 'tile';
    a.href = t.url;
    a.innerHTML = '<span class="glyph" style="background:' + t.bg + '">' + t.glyph + '</span><span class="label">' + t.label + '</span>';
    tiles.appendChild(a);
  });

  var clockEl = document.getElementById('clock');
  var dateEl = document.getElementById('date');
  function tick() {
    var now = new Date();
    clockEl.textContent = now.toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit' });
    dateEl.textContent = now.toLocaleDateString('fa-IR', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
  }
  tick();
  setInterval(tick, 1000 * 20);

  document.getElementById('themeToggle').addEventListener('click', function () {
    var next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
    document.documentElement.dataset.theme = next;
    try { window.localStorage.setItem('tb-theme', next); } catch (e) { /* non-fatal */ }
  });
</script>
</body>
</html>
