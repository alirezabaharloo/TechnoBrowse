<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; font-src 'self'; form-action https://www.google.com; base-uri 'none'" />
<title>زبانهٔ جدید</title>
<style>
  @font-face {
    font-family: 'Vazirmatn';
    font-style: normal;
    font-weight: 400;
    font-display: swap;
    src: url('./fonts/vazirmatn-arabic-400-normal.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Vazirmatn';
    font-style: normal;
    font-weight: 700;
    font-display: swap;
    src: url('./fonts/vazirmatn-arabic-700-normal.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Vazirmatn';
    font-style: normal;
    font-weight: 800;
    font-display: swap;
    src: url('./fonts/vazirmatn-arabic-800-normal.woff2') format('woff2');
  }
  :root {
    --bg: #eef1f8;
    --panel: #ffffff;
    --panel-border: rgba(15, 23, 42, 0.10);
    --text: #1e293b;
    --muted: #64748b;
    --accent: #2563eb;
    --accent-2: #3d8bff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background:
      radial-gradient(900px 520px at 50% -10%, rgba(59, 130, 246, 0.16), transparent 60%),
      radial-gradient(700px 500px at 85% 110%, rgba(61, 139, 255, 0.12), transparent 60%),
      radial-gradient(600px 420px at 8% 105%, rgba(37, 99, 235, 0.10), transparent 55%),
      var(--bg);
    color: var(--text);
    font-family: 'Vazirmatn', 'Segoe UI', Tahoma, system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 48px 24px;
    min-height: 100vh;
    user-select: none;
  }
  .clock { font-size: 60px; font-weight: 800; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; line-height: 1.15; }
  .date { margin-top: 10px; color: var(--muted); font-size: 14px; font-weight: 500; }
  .brand { margin-top: 28px; display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 0.06em; }
  .brand img { width: 34px; height: 34px; border-radius: 9px; }

  form.search { margin-top: 24px; width: min(620px, 92vw); }
  .search-shell {
    display: flex; align-items: center; gap: 12px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 16px;
    padding: 4px 8px 4px 8px; padding-inline-start: 18px;
    box-shadow: 0 6px 18px rgba(15, 23, 42, 0.08);
    transition: border-color .18s ease, box-shadow .18s ease;
  }
  .search-shell:focus-within {
    border-color: rgba(37, 99, 235, 0.45);
    box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.14), 0 18px 50px rgba(15, 23, 42, 0.14);
  }
  .search-shell svg { color: var(--muted); flex: 0 0 auto; }
  .search-shell input {
    flex: 1; background: transparent; border: 0; outline: none;
    color: var(--text); font-size: 16px; height: 46px; font-family: inherit;
    min-width: 0;
  }
  .search-shell input::placeholder { color: #94a3b8; }
  .go {
    border: 0; cursor: pointer; border-radius: 12px; height: 40px; padding: 0 20px;
    color: #fff; font-weight: 700; font-size: 14px; font-family: inherit;
    background: linear-gradient(135deg, #1d4ed8, #2563eb);
    box-shadow: 0 6px 16px rgba(37, 99, 235, 0.35);
    transition: transform .15s ease, filter .15s ease;
    flex: 0 0 auto;
  }
  .go:hover { transform: translateY(-1px); filter: brightness(1.06); }
  .go:active { transform: translateY(0); }

  .tiles { margin-top: 32px; display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; max-width: 720px; }
  .tile {
    width: 118px; height: 108px; border-radius: 16px; text-decoration: none;
    background: var(--panel); border: 1px solid var(--panel-border);
    box-shadow: 0 4px 14px rgba(15, 23, 42, 0.06);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    transition: transform .16s ease, border-color .16s ease, box-shadow .16s ease;
  }
  .tile:hover {
    transform: translateY(-3px);
    border-color: rgba(37, 99, 235, 0.35);
    box-shadow: 0 14px 34px rgba(15, 23, 42, 0.14);
  }
  .tile .glyph {
    width: 40px; height: 40px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 17px; color: #0b1220;
  }
  .tile .label { color: var(--text); font-size: 12.5px; font-weight: 600; }
  .hint { margin-top: 30px; color: #94a3b8; font-size: 12px; font-weight: 500; }
</style>
</head>
<body>
  <div class="clock" id="clock">--:--</div>
  <div class="date" id="date">در حال بارگذاری…</div>
  <div class="brand"><img src="./technowin.png" alt="تکنوبروز" /> تکنوبروز</div>

  <form class="search" action="https://www.google.com/search" method="GET">
    <div class="search-shell">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="q" name="q" type="text" placeholder="جستجو در گوگل یا نشانی در نوار آدرس…" autocomplete="off" spellcheck="false" autofocus />
      <button class="go" type="submit">جستجو</button>
    </div>
  </form>

  <div class="tiles" id="tiles"></div>
  <div class="hint">هر پروفایل کوکی‌ها، نشست‌ها و حافظهٔ خودش را نگه می‌دارد — بدون ترکیب حساب‌ها جابه‌جا شوید.</div>

<script>
  var TILES = [
    { label: 'گوگل',     url: 'https://www.google.com',    glyph: 'G',  bg: 'linear-gradient(135deg,#fde68a,#fbbf24)' },
    { label: 'جیمیل',    url: 'https://mail.google.com',   glyph: 'ای', bg: 'linear-gradient(135deg,#fda4af,#fb7185)' },
    { label: 'چت‌جی‌پی‌تی', url: 'https://chatgpt.com',    glyph: 'چ',  bg: 'linear-gradient(135deg,#a7f3d0,#34d399)' },
    { label: 'جمینای',   url: 'https://gemini.google.com', glyph: 'ج',  bg: 'linear-gradient(135deg,#c4b5fd,#8b5cf6)' },
    { label: 'کلود',     url: 'https://claude.ai',         glyph: 'ک',  bg: 'linear-gradient(135deg,#fed7aa,#fb923c)' },
    { label: 'یوتیوب',   url: 'https://www.youtube.com',   glyph: 'ی',  bg: 'linear-gradient(135deg,#fecaca,#ef4444)' },
    { label: 'گیت‌هاب',  url: 'https://github.com',        glyph: 'گ',  bg: 'linear-gradient(135deg,#cbd5e1,#64748b)' },
    { label: 'ویکی‌پدیا', url: 'https://www.wikipedia.org', glyph: 'و', bg: 'linear-gradient(135deg,#e2e8f0,#94a3b8)' }
  ];
  var tiles = document.getElementById('tiles');
  TILES.forEach(function (t) {
    var a = document.createElement('a');
    a.className = 'tile';
    a.href = t.url;
    a.innerHTML = '<span class="glyph" style="background:' + t.bg + '">' + t.glyph + '</span><span class="label">' + t.label + '</span>';
    tiles.appendChild(a);
  });

  var clockEl = document.getElementById('clock');
  var dateEl = document.getElementById('date');
  function tick() {
    var now = new Date();
    clockEl.textContent = now.toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit' });
    dateEl.textContent = now.toLocaleDateString('fa-IR', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
  }
  tick();
  setInterval(tick, 1000 * 20);
</script>
</body>
</html>
