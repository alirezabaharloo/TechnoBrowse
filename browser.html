<!doctype html>
<html lang="fa" dir="rtl" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/png" href="./technowin.png" />
    <title>TechnoBrowse</title>
    <script>
      try {
        var t = window.localStorage.getItem('tb-theme');
        document.documentElement.dataset.theme = (t === 'light' || t === 'dark') ? t : 'dark';
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
  </head>
  <body class="bg-ink-900 overflow-hidden">
    <div id="root"></div>
    <script type="module" src="/src/browser/main.jsx"></script>
  </body>
</html>
